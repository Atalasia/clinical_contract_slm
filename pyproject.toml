[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-slm-output-contract-benchmark"
version = "0.1.0"
description = "Code supporting the clinical SLM output-contract benchmark"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
analysis = [
  "matplotlib==3.6.3",
  "numpy==1.26.4",
]
inference = [
  "accelerate==1.13.0",
  "huggingface-hub==1.18.0",
  "nvidia-ml-py==13.610.43",
  "numpy==2.4.6",
  "torch==2.11.0",
  "transformers==5.10.2",
  "vllm==0.22.1",
]

[project.scripts]
cpg2-paper = "cpg2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
